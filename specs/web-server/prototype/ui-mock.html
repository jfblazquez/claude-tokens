      { key: "cache_read_tokens", label: "Cache read", num: true, render: (r) => fmt(r.cache_read_tokens) },
      { key: "cache_write_tokens", label: "Cache write", num: true, render: (r) => fmt(r.cache_write_tokens) },
      { key: "last_output_tokens", label: "Last output", num: true, render: (r) => fmt(r.last_output_tokens) },
    ], [CONTEXT]));
  const coldSec = h("section", { class: "section" }, h("div", { class: "section-head" }, h("h2", {}, "Cold-summary estimate"), h("span", { class: "hint" }, "What summarizing this context would cost without cache")),
    renderTable([
      { key: "model", label: "Model", render: (r) => [swatch(r.model), r.model] },
      { key: "cold", label: "Cold input", num: true, render: () => fmt(CONTEXT.context_tokens) },
      { key: "out", label: "Assumed output", num: true, render: () => fmt(2000) },

  const notice = h("div", { class: "notice", role: "note" }, "~ estimated price: no published rate for claude-sonnet-5-6; priced from the newest known model of the same family. Use --pricing to set the real rate.");
  return [...headParts, stats, notice, usage, models, context, coldSec];
}

function viewResponse() {
  const headParts = convHeader("response");
  if (state === "loading") return [...headParts, skeleton(9)];
  if (state === "error") return [...headParts, errorState("The server stopped responding. Check that claude_tokens.py --serve is still running, then retry.")];
  if (state === "empty") return [...headParts, emptyState("No text response", "The main conversation has no assistant text response yet. Responses from subagents are not shown here.")];
  const box = h("article", { class: "card md" });
  box.innerHTML = DOMPurify.sanitize(marked.parse(LAST_RESPONSE));
  box.querySelectorAll("pre code").forEach((el) => hljs.highlightElement(el));
  const note = h("div", { class: "proto-note" }, h("b", {}, "Prototype note: "), "the sample response contains a <script> and a javascript: link. DOMPurify removed both, so the link shows as plain text and nothing runs (R2.7).");
  return [...headParts, h("div", { class: "meta" }, "Last assistant text response of the main conversation · rendered Markdown"), box, note];
}

const sourceChip = (s) => h("span", { class: s === "main" ? "chip main" : "chip", title: s === "main" ? "Main conversation" : `Subagent ${s}` }, s === "main" ? "main" : `subagent ${s.slice(0, 8)}`);

  return [...headParts, h("div", { class: "meta" }, "One row per file · counts add up every source that touched it"),

function viewTotals() {

    h("div", { class: "meta" }, h("span", {}, "Every conversation and subagent in ", h("b", { class: "mono" }, PROJECTS_DIR)), h("span", {}, "Days are UTC")));
  const filter = h("label", { class: "field" }, "Project", h("input", { id: "totals-filter", type: "search", placeholder: "Filter by project path", value: totalsFilter,

  if (state === "error") return [head, toolbar, errorState("The server stopped responding while scanning the logs. Check that claude_tokens.py --serve is still running, then retry.")];
  const T = buildTotals(totalsFilter);
  if (state === "empty" || !T.conversations) return [head, toolbar, emptyState("Nothing to total yet", totalsFilter && state !== "empty" ? `No project matches “${totalsFilter}”.` : `There are no conversation logs in ${PROJECTS_DIR}, so there is no usage to aggregate.`)];
  const w = T.window;

    h("div", { class: "stat" }, h("div", { class: "k" }, "Total cost"), h("div", { class: "v" }, money(T.estimated_total_cost_usd, true, 2)), h("div", { class: "d" }, `${money(T.cost_per_conversation_usd, false, 2)} per conversation`)),
    h("div", { class: "stat" }, h("div", { class: "k" }, "Tokens"), h("div", { class: "v" }, `${(T.total_tokens / 1e6).toFixed(1)} M`), h("div", { class: "d" }, `${fmt(T.output_tokens)} generated`)),
    h("div", { class: "stat" }, h("div", { class: "k" }, "Volume"), h("div", { class: "v" }, fmt(T.conversations)), h("div", { class: "d" }, `conversations · ${fmt(T.subagents)} subagents · ${T.projects_count} projects`)),
    h("div", { class: "stat" }, h("div", { class: "k" }, "Cache hits"), h("div", { class: "v" }, pct(T.cache_hit_ratio)), h("div", { class: "d" }, "of input tokens served from cache")),
    h("div", { class: "stat" }, h("div", { class: "k" }, "Time window"), h("div", { class: "v" }, `${w.span_days} days`), h("div", { class: "d" }, `${w.start.slice(0, 10)} → ${w.end.slice(0, 10)} · ${w.active_days} active · busiest ${w.busiest_day}`)));

  const card = (title, sub, box, extra) => h("div", { class: "card chart-card" + (extra || "") }, h("h3", {}, title), sub ? h("div", { class: "sub" }, sub) : null, box);

    card("Daily cost by model", undated ? `Undated records (no timestamp, not plotted): ${money(undated.estimated_cost_usd, false, 2)} · ${fmt(undated.total_tokens)} tokens` : null,
      h("div", { style: { display: "grid", gap: "8px" } }, legend, box("c-daily", "tall")), " chart-wide"),
    card("Model share", "Percentage of cost and of tokens per model", h("div", { class: "pair" }, box("c-share-cost"), box("c-share-tok"))),

  const modelTable = h("section", { class: "section" }, h("h2", {}, "Usage by model"), renderTable([
    { key: "model", label: "Model", render: (r) => [swatch(r.model), r.model] },

  ], T.by_model, { sortKey: "estimated_cost_usd" }));
  const projTable = h("section", { class: "section" }, h("h2", {}, "Projects by cost"), renderTable([
    { key: "project", label: "Project", render: (r) => h("span", { class: "mono" }, r.project) },
    { key: "conversations", label: "Conversations", num: true },
    { key: "total_tokens", label: "Total tokens", num: true, render: (r) => fmt(r.total_tokens) },
    { key: "estimated_cost_usd", label: "Cost", num: true, render: (r) => money(r.estimated_cost_usd, false, 2) },
  ], T.projects, { sortKey: "estimated_cost_usd" }));
  const toolRows = Object.entries(T.tools).map(([tool, calls]) => ({ tool, calls, pct: calls / T.tool_calls }));

    h("section", { class: "section" }, h("h2", {}, "Skills used"), renderTable([{ key: "skill", label: "Skill", render: (r) => h("span", { class: "mono" }, r.skill) }, { key: "n", label: "Invocations", num: true }], skillRows, { sortKey: "n" })));
  queueMicrotask(() => drawCharts(T));
  return [head, toolbar, stats, ...notices, chartsEl, modelTable, projTable, twoTables];
}

// ---------- charts ----------
function drawCharts(T) {
  charts.forEach((c) => c.destroy()); charts = [];
  if (!window.Chart || !$("c-daily")) return;
  const fg = css("--muted"), grid = css("--grid"), accent = css("--accent");
  Chart.defaults.font.family = css("--font"); Chart.defaults.font.size = 12; Chart.defaults.color = fg;
  const axes = (xTitle, yFmt, stacked) => ({
    x: { stacked, grid: { color: grid, drawTicks: false }, border: { color: grid }, ticks: { color: fg, maxRotation: 0, autoSkipPadding: 10 }, title: { display: !!xTitle, text: xTitle, color: fg } },
    y: { stacked, grid: { color: grid, drawTicks: false }, border: { display: false }, ticks: { color: fg, padding: 6, callback: yFmt } } });
  const base = { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } } };
  const dated = T.daily.filter((d) => d.day), labels = dated.map((d) => d.day.slice(5));
  const models = T.by_model.map((r) => r.model);
  charts.push(new Chart($("c-daily"), { type: "bar",
    data: { labels, datasets: models.map((m) => ({ label: m, data: dated.map((d) => (d.models[m] ? d.models[m].estimated_cost_usd || 0 : 0)), backgroundColor: colorOf[m], borderRadius: 2, maxBarThickness: 22 })) },
    options: { ...base, scales: axes("Day (UTC)", (v) => `$${v}`, true),
      plugins: { legend: { display: false }, tooltip: { mode: "index", filter: (i) => i.raw > 0, callbacks: { title: (i) => `${dated[i[0].dataIndex].day} (UTC)`, label: (i) => ` ${i.dataset.label}: ${money(i.raw, i.dataset.label === "claude-sonnet-5-6", 2)}`,
        footer: (i) => `Day total: ${money(dated[i[0].dataIndex].estimated_cost_usd, false, 2)}` } } } } }));
  const shareChart = (id, key, title) => charts.push(new Chart($(id), { type: "bar",
    data: { labels: models, datasets: [{ data: T.by_model.map((r) => (r[key] == null ? 0 : r[key] * 100)), backgroundColor: models.map((m) => colorOf[m]), borderRadius: 3, maxBarThickness: 18 }] },
    options: { ...base, indexAxis: "y", scales: { ...axes(title, null, false), x: { ...axes(title).x, max: 100, ticks: { color: fg, callback: (v) => `${v}%` } }, y: { grid: { display: false }, border: { display: false }, ticks: { color: fg, callback: (_, i) => models[i].replace("claude-", "") } } },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (i) => ` ${i.raw.toFixed(1)}%` } } } } }));
  shareChart("c-share-cost", "pct_cost", "% of cost"); shareChart("c-share-tok", "pct_tokens", "% of tokens");
  const hbar = (id, labelsH, data, color, fmtV, title) => charts.push(new Chart($(id), { type: "bar",
    data: { labels: labelsH, datasets: [{ data, backgroundColor: color, borderRadius: 3, maxBarThickness: 16 }] },
    options: { ...base, indexAxis: "y", scales: { x: axes(title).x, y: { grid: { display: false }, border: { display: false }, ticks: { color: fg } } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (i) => ` ${fmtV(i.raw)}` } } } } }));
  const proj = T.projects.slice(0, 15);
  hbar("c-projects", proj.map((p) => p.project.split("/").pop()), proj.map((p) => p.estimated_cost_usd), accent, (v) => money(v, false, 2), "Cost (USD)");
  const tools = Object.entries(T.tools).sort((a, b) => b[1] - a[1]).slice(0, 15), skills = Object.entries(T.skills).sort((a, b) => b[1] - a[1]).slice(0, 15);
  hbar("c-tools", tools.map((t) => t[0]), tools.map((t) => t[1]), accent, fmt, "Tool calls");
  hbar("c-skills", skills.map((t) => t[0]), skills.map((t) => t[1]), css("--m5"), fmt, "Invocations");
  charts.push(new Chart($("c-activity"), { type: "line",
    data: { labels, datasets: [{ data: dated.map((d) => d.responses), borderColor: accent, backgroundColor: mixHex(accent, css("--surface"), 0.82), fill: true, tension: 0.3, pointRadius: dated.map((_, i) => (i === dated.length - 1 ? 4 : 0)), pointBackgroundColor: accent, borderWidth: 2 }] },
    options: { ...base, scales: axes("Day (UTC)", (v) => fmt(v), false), plugins: { legend: { display: false }, tooltip: { callbacks: { title: (i) => `${dated[i[0].dataIndex].day} (UTC)`, label: (i) => ` ${fmt(i.raw)} responses` } } } } }));
}

// ---------- shell ----------
const VIEWS = { list: viewList, report: viewReport, response: viewResponse, bash: viewBash, files: viewFiles, totals: viewTotals };
function render() {
  assignColors();
  $("main").replaceChildren(...VIEWS[screen]());
  const sc = SCREENS.find((s) => s.key === screen);
  $("screen-label").replaceChildren(document.createTextNode(`${SCREENS.indexOf(sc) + 1}/${SCREENS.length} · ${sc.name}`), h("small", {}, sc.route));
  $("nav-list").toggleAttribute("aria-current", screen !== "totals"); if (screen !== "totals") $("nav-list").setAttribute("aria-current", "page");
  $("nav-totals").toggleAttribute("aria-current", screen === "totals"); if (screen === "totals") $("nav-totals").setAttribute("aria-current", "page");
  $("loaded").textContent = state === "loading" ? "Loading…" : `Loaded at ${utcTime(loadedAt)} UTC`;
  document.querySelectorAll("#state-seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === state)));
}
function go(key) { screen = key; state = "normal"; render(); window.scrollTo(0, 0); }
function cycle(step) { const i = SCREENS.findIndex((s) => s.key === screen); go(SCREENS[(i + step + SCREENS.length) % SCREENS.length].key); }
$("prev").addEventListener("click", () => cycle(-1));
$("next").addEventListener("click", () => cycle(1));
$("nav-list").addEventListener("click", () => go("list"));
$("nav-totals").addEventListener("click", () => go("totals"));
document.addEventListener("keydown", (e) => { const t = e.target; if (t.closest && t.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1); if (e.key === "ArrowRight") cycle(1); });
$("state-seg").append(...STATES.map((s) => h("button", { type: "button", "data-v": s, onclick: () => { state = s; render(); } }, s[0].toUpperCase() + s.slice(1))));
let theme = "system";
$("theme-seg").append(...["system", "light", "dark"].map((t) => h("button", { type: "button", "data-v": t, "aria-pressed": String(t === theme),
  onclick: () => { theme = t; if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
    document.querySelectorAll("#theme-seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === theme))); render(); } }, t[0].toUpperCase() + t.slice(1))));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (theme === "system") render(); });
function refresh() { state = "loading"; render(); setTimeout(() => { loadedAt = new Date(); state = "normal"; render(); }, 900); }
$("refresh").addEventListener("click", refresh);
let timer = null;
$("auto").addEventListener("change", (e) => { clearInterval(timer); timer = e.target.checked ? setInterval(refresh, 30000) : null; });
render();
</script>
